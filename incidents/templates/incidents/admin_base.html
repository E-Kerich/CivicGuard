{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicGuard Admin</title>

    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            height: 100vh;
            background-color: #002855;
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 30px;
            color: white;
        }

        .sidebar a {
            color: white;
            padding: 12px 20px;
            display: block;
            text-decoration: none;
            font-size: 15px;
        }

        .sidebar a:hover {
            background-color: #003b80;
        }

        /* Content section */
        .content {
            margin-left: 260px;
            padding: 30px;
        }

        /* Mobile Sidebar */
        @media (max-width: 768px) {
            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
            }
            .content {
                margin-left: 0;
            }
        }
    </style>

</head>


<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h4 class="text-center fw-bold mb-4">CivicGuard Admin</h4>

        <a href="{% url 'admin_dashboard' %}">Dashboard</a>
        <a href="{% url 'admin_incident_list' %}">Manage Incidents</a>
        <a href="{% url 'admin_incident_add' %}">Add Incident</a>
        <a href="#">Donations</a>
        <a href="{% url 'admin_logout' %}" class="text-danger">Logout</a>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- CONTENT -->
    <div class="content">
        {% block content %}
        {% endblock %}
    </div>


   



</body>
</html>
