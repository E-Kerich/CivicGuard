{% extends 'incidents/admin_base.html' %}

{% block content %}

<h2 class="fw-bold mb-4" style="color:#002855;">Delete Incident</h2>

<div class="card shadow-sm p-4">

    <p class="mb-4">
        Are you sure you want to delete this incident?
        <br><br>
        <strong>Reference ID:</strong> {{ incident.reference_id }} <br>
        <strong>Type:</strong> {{ incident.incident_type }} <br>
        <strong>User:</strong> {{ incident.user_name }}
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit" class="btn btn-danger px-4">
            Yes, Delete Incident
        </button>

        <a href="{% url 'admin_incident_detail' incident.id %}" class="btn btn-secondary px-4 ms-2">
            Cancel
        </a>
    </form>
</div>

{% endblock %}
