{% extends 'incidents/admin_base.html' %}

{% block content %}

<h2 class="fw-bold mb-4" style="color:#002855;">Edit Incident</h2>

<div class="card shadow-sm p-4">

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <h5 class="fw-bold mb-3">User Information</h5>
        
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <label class="form-label">Full Name</label>
                <input type="text" name="user_name" value="{{ incident.user_name }}" class="form-control">
            </div>

            <div class="col-md-4">
                <label class="form-label">Email</label>
                <input type="email" name="user_email" value="{{ incident.user_email }}" class="form-control">
            </div>

            <div class="col-md-4">
                <label class="form-label">Phone</label>
                <input type="text" name="user_phone" value="{{ incident.user_phone }}" class="form-control">
            </div>
        </div>

        <h5 class="fw-bold mb-3">Incident Information</h5>

        <div class="mb-3">
            <label class="form-label">Type of Incident</label>
            <input type="text" name="incident_type" value="{{ incident.incident_type }}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Location</label>
            <input type="text" name="location" value="{{ incident.location }}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="5">{{ incident.description }}</textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Evidence File</label><br>
            
            {% if incident.evidence_file %}
                <p>
                    Current file: 
                    <a href="{{ incident.evidence_file.url }}" target="_blank" class="text-primary">
                        View Evidence
                    </a>
                </p>
            {% endif %}

            <input type="file" name="evidence_file" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary px-4 mt-3">Save Changes</button>
    </form>

</div>

{% endblock %}
